{% extends "base.html" %}

{% block title %}Internal Server Error - WECar 연구개발일지{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                    </div>
                    <h1 class="display-4 mb-3">500</h1>
                    <h2 class="mb-4">Internal Server Error</h2>
                    <p class="text-muted mb-4">
                        서버에 오류가 발생했습니다. 잠시 후 다시 시도해주세요.
                    </p>
                    <div class="mt-4">
                        <a href="{{ url_for('auth.login') }}" class="btn btn-primary me-2">
                            <i class="bi bi-house-door"></i> 로그인 페이지로 이동
                        </a>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 이전 페이지
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
