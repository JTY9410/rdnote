services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: wecar_user
      POSTGRES_PASSWORD: wecar_pass
      POSTGRES_DB: wecar_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecar_user -d wecar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "5501:5000"
    environment:
      DATABASE_URL: postgresql://wecar_user:wecar_pass@db:5432/wecar_db?sslmode=disable
      SECRET_KEY: wecar-secret-key-change-in-production
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      FLASK_APP: ${FLASK_APP:-wsgi:app}
      UPLOAD_FOLDER: uploads
      EXPORT_FOLDER: exports
    volumes:
      # 소스 코드 자동 반영 (개발 모드)
      - ./app:/app/app
      - ./api:/app/api
      - ./migrations:/app/migrations
      - ./templates:/app/templates
      - ./static:/app/static
      - ./requirements.txt:/app/requirements.txt
      - ./wsgi.py:/app/wsgi.py
      - ./run.py:/app/run.py
      - ./alembic.ini:/app/alembic.ini
      - ./db_connection_helper.py:/app/db_connection_helper.py
      - ./init_db.py:/app/init_db.py
      # 데이터 디렉토리
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        python3 init_db.py || echo 'Init script completed' &&
        if [ \"$$FLASK_ENV\" = \"development\" ]; then
          echo 'Starting Flask in development mode (auto-reload enabled)...' &&
          export FLASK_APP=wsgi:app &&
          python3 -m flask run --host=0.0.0.0 --port=5000 --reload --debugger
        else
          echo 'Starting Gunicorn in production mode...' &&
          gunicorn -w 4 -b 0.0.0.0:5000 --timeout 120 wsgi:app
        fi
      "

    # Auto-rebuild/restart on source changes (Docker Compose v2.22+)
    develop:
      watch:
        - path: ./app
          action: sync
          target: /app/app
        - path: ./api
          action: sync
          target: /app/api
        - path: ./templates
          action: sync
          target: /app/templates
        - path: ./static
          action: sync
          target: /app/static
        - path: ./requirements.txt
          action: rebuild

volumes:
  postgres_data:

